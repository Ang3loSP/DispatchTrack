# DispatchTrack Deploy to Render
# Triggers on successful CI on main branch only.
# Calls Render Deploy Hook (configured in Render dashboard).
# Render auto-deploy is OFF so tests gate every deploy.

name: Deploy to Render

'on':
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    name: Deploy to Render
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger Render Deploy Hook
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          # A missing secret must fail the workflow: a green "Deploy to Render" that
          # deployed nothing is how production drifted four commits behind.
          if [ -z "$RENDER_DEPLOY_HOOK" ]; then
            echo "::error::RENDER_DEPLOY_HOOK is not set - CI passed but nothing was deployed."
            exit 1
          fi
          curl -fsS -X POST "$RENDER_DEPLOY_HOOK"
          echo "Deploy hook triggered. Render dashboard has build status (2-4 min, cold start on free tier)."